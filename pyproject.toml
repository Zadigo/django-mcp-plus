[project]
name = "django-mcp-plus"
version = "0.1.0"
requires-python = ">=3.14"
description = "Django MCP Server is a Django extensions to easily enable AI Agents to interact with Django Apps through the Model Context Protocol it works equally well on WSGI and ASGI"
license = {text = "MIT"}
readme = "README.md"
keywords = ["django", "mcp", "model context protocol", "tools"]
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "django-oauth-toolkit>=3.4.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "httpx2>=2.10.0",
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "google-adk>=2.7.1",
    "pytest>=9.1.1",
    "pytest-aio>=2.1.7",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.7.0",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.5.0",
    "ruff>=0.16.3",
]

[tool.pyright]
typeCheckingMode = "off"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
testpaths = ["tests"]
timeout= 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mango: marks tests as mango query tests",
]

[tool.pytest_env]
env_files = [".env", ".env.test"]

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 3

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.coverage.run]
omit = [
    "manage.py",
    "*/migrations/*",
    "*/__init__.py",
    "*/typings.py",
    "tests/*",
    "test/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv.build-backend]
source-exclude = [
    "tests/**",
    "docs/**",
    "*.log",
    "**/.DS_Store",
    'conftest.py',
]
