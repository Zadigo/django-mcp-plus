name: Django MCP Plus Test Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Django MCP Plus environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

env:
  PYTHON_VERSION: 3.14

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.14]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uvicorn
          uvicorn --version
      - name: Run tests
        run: pytest --tab=short -rapP --durations=10 --reuse-db tests/
